name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: ./gradlew assembleRelease
      - name: Publish the APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "mrd-discovery-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "mrd-discovery-${GITHUB_REF_NAME}.apk" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
